<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ganesha AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #overlay {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      z-index: 9999;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div id="overlay">
    📷 Allow camera access and point at the Hiro marker
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-assets>
      <video id="ganeshaVideo"
             src="idol-animation.mp4"
             preload="auto"
             loop
             muted
             playsinline
             webkit-playsinline>
      </video>
    </a-assets>

    <!-- Marker -->
    <a-marker preset="hiro" id="marker">
      <a-video
        src="#ganeshaVideo"
        width="1.2"
        height="1.6"
        position="0 0.8 0"
        rotation="-90 0 0">
      </a-video>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const marker = document.querySelector('#marker');
    const video = document.querySelector('#ganeshaVideo');
    const overlay = document.querySelector('#overlay');

    marker.addEventListener('markerFound', async () => {
      overlay.innerHTML = '✨ Ganesha animation active';
      try {
        await video.play();
      } catch (e) {
        console.log(e);
      }
    });

    marker.addEventListener('markerLost', () => {
      overlay.innerHTML = '📷 Point at the Hiro marker';
      video.pause();
    });

    // Start video on first user interaction (required by mobile browsers)
    document.body.addEventListener('click', async () => {
      try {
        await video.play();
        video.pause();
      } catch (e) {}
    }, { once: true });
  </script>

</body>
</html>
