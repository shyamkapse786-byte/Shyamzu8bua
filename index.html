<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ganesha AR Overlay</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #msg {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 15px;
      border-radius: 10px;
      z-index: 9999;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div id="msg">📷 Point camera at the Hiro marker</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <a-assets>
      <video id="ganeshaVideo"
             src="ganesha-overlay.mp4"
             preload="auto"
             loop
             muted
             playsinline
             webkit-playsinline
             crossorigin="anonymous">
      </video>
    </a-assets>

    <!-- Hiro marker tracking -->
    <a-marker preset="hiro" id="marker">

      <!-- Video overlay -->
      <a-video
        src="#ganeshaVideo"
        width="1.4"
        height="1.8"
        position="0 0.9 0"
        rotation="-90 0 0">
      </a-video>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    const marker = document.querySelector('#marker');
    const video = document.querySelector('#ganeshaVideo');
    const msg = document.querySelector('#msg');

    // Mobile browsers require user interaction
    document.body.addEventListener('click', async () => {
      try {
        await video.play();
        video.pause();
      } catch (e) {
        console.log(e);
      }
    }, { once: true });

    marker.addEventListener('markerFound', async () => {
      msg.innerHTML = '✨ Ganesha overlay active';
      try {
        await video.play();
      } catch (e) {
        console.log(e);
      }
    });

    marker.addEventListener('markerLost', () => {
      msg.innerHTML = '📷 Point camera at the Hiro marker';
      video.pause();
    });
  </script>

</body>
</html>
