<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ganesha AR Overlay</title>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      z-index: 10;
      text-align: center;
    }

    #hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 14px;
      z-index: 10;
    }
  </style>
</head>

<body>
  <div id="container">
    <div id="loading">
      <h2>🙏 Loading AR Experience...</h2>
      <p>Allow camera access when prompted</p>
    </div>

    <div id="hint">
      Point your camera at the Ganesha idol image
    </div>
  </div>

  <script>
    async function startAR() {
      try {
        const mindarThree = new window.MINDAR.IMAGE.MindARThree({
          container: document.querySelector("#container"),
          imageTargetSrc: "targets.mind",
          uiScanning: true,
          uiLoading: false,
          uiError: true
        });

        const { renderer, scene, camera } = mindarThree;

        // -----------------------
        // LIGHTING
        // -----------------------
        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
        scene.add(light);

        // -----------------------
        // VIDEO SETUP
        // -----------------------
        const video = document.createElement("video");
        video.src = "idol-animation.webm"; // upload this file
        video.crossOrigin = "anonymous";
        video.loop = true;
        video.muted = true;
        video.autoplay = true;
        video.playsInline = true;
        video.setAttribute("webkit-playsinline", "true");
        video.setAttribute("playsinline", "true");

        // Wait for video to be ready
        await new Promise((resolve) => {
          video.addEventListener("loadeddata", resolve, { once: true });
        });

        const texture = new THREE.VideoTexture(video);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.format = THREE.RGBAFormat;

        // -----------------------
        // OVERLAY PLANE
        // -----------------------
        const geometry = new THREE.PlaneGeometry(1, 1.4);

        const material = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          side: THREE.DoubleSide
        });

        const plane = new THREE.Mesh(geometry, material);

        // Adjust overlay position and size
        plane.position.set(0, 0.2, 0);
        plane.scale.set(1.2, 1.2, 1.2);

        // -----------------------
        // IMAGE TARGET ANCHOR
        // -----------------------
        const anchor = mindarThree.addAnchor(0);
        anchor.group.add(plane);

        anchor.onTargetFound = async () => {
          console.log("🎯 Target Found");
          document.getElementById("hint").innerText = "✨ Ganesha animation active";

          try {
            await video.play();
          } catch (err) {
            console.error("Video play failed:", err);
          }
        };

        anchor.onTargetLost = () => {
          console.log("❌ Target Lost");
          document.getElementById("hint").innerText = "Point your camera at the Ganesha idol image";
          video.pause();
        };

        // -----------------------
        // START AR
        // -----------------------
        await mindarThree.start();

        document.getElementById("loading").style.display = "none";

        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });

      } catch (error) {
        console.error(error);
        document.getElementById("loading").innerHTML =
          "<h2>❌ Failed to start AR</h2><p>" + error.message + "</p>";
      }
    }

    startAR();
  </script>
</body>
</html>
